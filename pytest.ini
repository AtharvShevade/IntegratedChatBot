[pytest]
# H-14: reproducible, deterministic test suite from a clean checkout.
#
# - testpaths restricts collection to the actual test tree, so stray
#   debugging/repro scripts elsewhere in the repo (scripts/debug/*.py, some
#   of which match pytest's default test-file glob, e.g. query_test.py) are
#   never accidentally collected as tests.
# - The `live` and `realdata` markers let a test declare that it needs a
#   reachable Ollama/LLM endpoint or the real D:\ production/development data
#   tree. addopts excludes both by default so the normal suite is fast,
#   offline, and deterministic; run them explicitly when you actually want
#   them (see the marker descriptions below and doc/CRITICAL_FIXES_LOG.md's
#   H-14 section for the exact commands).
# - Most existing real-data/live-dependent tests predate these markers and
#   instead self-skip at runtime when the dependency they need is absent
#   (unchanged by this file) -- the markers are additive, for tests that
#   explicitly opt in going forward, not a retroactive relabeling of the
#   whole suite.
testpaths = backend
python_files = test_*.py
addopts = -m "not live and not realdata" --strict-markers

markers =
    live: requires a reachable live Ollama/LLM endpoint (excluded by default; run with -m live)
    realdata: requires the real D:\ production/development XML data tree (excluded by default; run with -m realdata)
