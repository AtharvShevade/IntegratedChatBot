# H-15: minimal local pre-commit hooks -- lint + secret scanning, run before
# a commit even reaches CI. Install once with `pre-commit install` after
# `pip install pre-commit`; run on demand with `pre-commit run --all-files`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: ["--exit-zero"]  # report-only until the existing findings are triaged (see H-15 CI notes)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=2048"]
